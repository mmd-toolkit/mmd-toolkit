name: Documentation and Playground Pages

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Diagnostic markers execute the workspace linter during docs rendering.
      - run: pnpm --filter @mmd-toolkit/parser --filter @mmd-toolkit/eslint-plugin run build
      - run: pnpm exec eslint packages/docs
      - run: pnpm exec prettier --check packages/docs .github/workflows/pages.yml
      - run: pnpm --filter @mmd-toolkit/docs run test
      - run: pnpm --filter @mmd-toolkit/docs run build
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: documentation
          path: packages/docs/lib/site
          if-no-files-found: error

  build-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mmd-toolkit/playground run typecheck
      - run: pnpm exec eslint packages/playground
      - run: pnpm exec prettier --check packages/playground .github/workflows/pages.yml
      - run: pnpm --filter @mmd-toolkit/playground run test
      - run: pnpm --filter @mmd-toolkit/playground run build
      - run: pnpm --filter @mmd-toolkit/playground exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @mmd-toolkit/playground run test:e2e
      # The traces and error contexts of failed end-to-end tests, which the job
      # log does not hold (it cuts the long values of the share tests).
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playground-e2e-failures
          path: packages/playground/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: playground
          path: packages/playground/lib
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-docs, build-playground]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: playground-pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      # Assemble one Pages tree matching the docs and Playground base paths.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: documentation
          path: ${{ runner.temp }}/pages
      - uses: actions/download-artifact@v8.0.2
        with:
          name: playground
          path: ${{ runner.temp }}/pages/playground
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
