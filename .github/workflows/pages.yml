name: Documentation and Playground Pages

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Diagnostic markers execute the workspace linter during docs rendering.
      - run: pnpm --filter @mmd-toolkit/parser --filter @mmd-toolkit/eslint-plugin run build
      - run: pnpm exec eslint packages/docs
      - run: pnpm exec prettier --check packages/docs .github/workflows/pages.yml
      - run: pnpm --filter @mmd-toolkit/docs run test
      - run: pnpm --filter @mmd-toolkit/docs run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: documentation
          path: packages/docs/lib/site
          if-no-files-found: error

  build-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mmd-toolkit/playground run typecheck
      - run: pnpm exec eslint packages/playground
      - run: pnpm exec prettier --check packages/playground .github/workflows/pages.yml
      - run: pnpm --filter @mmd-toolkit/playground run test
      - run: pnpm --filter @mmd-toolkit/playground run build
      - run: pnpm --filter @mmd-toolkit/playground exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @mmd-toolkit/playground run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: playground
          path: packages/playground/lib
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-docs, build-playground]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: playground-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Assemble one Pages tree matching the docs and Playground base paths.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: documentation
          path: ${{ runner.temp }}/pages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: playground
          path: ${{ runner.temp }}/pages/playground
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
