name: Playground Pages

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mmd-toolkit/playground run typecheck
      - run: pnpm exec eslint packages/playground
      - run: pnpm exec prettier --check packages/playground .github/workflows/playground-pages.yml
      - run: pnpm --filter @mmd-toolkit/playground run test
      - run: pnpm --filter @mmd-toolkit/playground run build
      - run: pnpm --filter @mmd-toolkit/playground exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @mmd-toolkit/playground run test:e2e
      - name: Stage the Pages subdirectory
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/playground-pages/playground"
          cp -R packages/playground/lib/. "$RUNNER_TEMP/playground-pages/playground/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/playground-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: playground-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ format('{0}playground/', steps.deployment.outputs.page_url) }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
