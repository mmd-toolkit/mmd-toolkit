name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          # Fetch all history so that changesets can generate changelogs with the correct commits
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # The version step regenerates the linter documents, which import the
      # built parser; the publish step builds again through `prerelease`.
      - name: Build
        run: pnpm run build
      # Version 2 of the action reads what `changeset publish` (Changesets 3)
      # released from the file named by CHANGESETS_OUTPUT, which the publish
      # script passes on, and pushes the tags and creates the GitHub releases
      # of those packages.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          version-script: pnpm run version:ci
          publish-script: pnpm run release
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          NPM_CONFIG_PROVENANCE: true
