name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI runs mermaid.js itself and takes no result from the store of earlier
# results (packages/tests/docs/expected-results.md).
env:
  MMD_TOOLKIT_MERMAID_CACHE: disabled

jobs:
  action-lock:
    name: Verify action lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify action lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @mmd-toolkit/eslint-plugin... run build
      - name: ESLint
        run: pnpm run lint:es

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run lint:ts

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The document check reads the commit history to list the Japanese
          # versions that are older than their English original.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Build parser for rule document checks
        run: pnpm --filter @mmd-toolkit/parser run build
      - name: Japanese document check
        run: pnpm run lint:ja
      - name: Document check
        run: pnpm run lint:docs
      - name: Invisible character check
        run: pnpm run lint:chars

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check

  test:
    name: "Test on Node.js ${{ matrix.node }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test

  fixtures:
    name: Fixtures match mermaid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Regenerate expected.json
        run: pnpm --filter @mmd-toolkit/tests run fixtures:generate
      - name: Fail if mermaid's behavior changed
        run: |
          git diff --exit-code -- packages/tests/fixtures
          test -z "$(git status --porcelain -- packages/tests/fixtures)"
