name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI runs mermaid.js itself and takes no result from the store of earlier
# results (packages/tests/docs/expected-results.md).
env:
  MMD_TOOLKIT_MERMAID_CACHE: disabled

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check

  test:
    name: "Test on Node.js ${{ matrix.node }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test

  fixtures:
    name: Fixtures match mermaid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Regenerate expected.json
        run: pnpm --filter @mmd-toolkit/tests run fixtures:generate
      - name: Fail if mermaid's behavior changed
        run: |
          git diff --exit-code -- packages/tests/fixtures
          test -z "$(git status --porcelain -- packages/tests/fixtures)"
